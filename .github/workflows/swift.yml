name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project EqualEase/EqualEase.xcodeproj \
            -scheme EqualEase \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild \
            -project EqualEase/EqualEase.xcodeproj \
            -scheme EqualEase \
            -configuration Debug \
            -destination 'platform=macOS' \
            test \
            CODE_SIGNING_ALLOWED=NO
